name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -s settings.xml -gs settings.xml verify
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: frontend
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: qingzhou_test
          POSTGRES_USER: qingzhou
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qingzhou -d qingzhou_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -s settings.xml -gs settings.xml verify
        working-directory: backend
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/qingzhou_test
          DB_USER: qingzhou
          DB_PASSWORD: ci-only-password
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-test-results
          path: backend/target/surefire-reports/
          retention-days: 7
  deployment-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the combined Vue and Spring Boot deployment image
        run: docker build --tag qingzhou-procurement:verify .
