# qingzhou-managed: install only AFTER the certificate exists.
server {
    listen 80;
    server_name www.example.com;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/qingzhou-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://www.example.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name www.example.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/www.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:QingzhouSSL:10m;
    ssl_session_timeout 1d;
    client_max_body_size 2m;

    location /actuator/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host www.example.com;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host www.example.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_cookie_flags JSESSIONID secure httponly samesite=lax;
    }
}
