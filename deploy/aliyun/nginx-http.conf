# qingzhou-managed: certificate validation only; application opens on HTTPS later.
server {
    listen 80;
    server_name www.example.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/qingzhou-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 503 "HTTPS setup in progress. Please try again later.\n";
    }
}
