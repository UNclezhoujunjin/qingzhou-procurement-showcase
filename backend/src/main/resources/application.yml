server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
spring:
  application:
    name: qingzhou-procurement
  profiles:
    default: local
  jackson:
    time-zone: Asia/Shanghai
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/qingzhou;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  demo: false
  bootstrap-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
---
spring:
  config:
    activate:
      on-profile: local
app:
  demo: true
